<title>Konzertkalender</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Monatskalender links (mitlaufend), Ticket-Abschnitte rechts, mobil untereinander */
:root {
  --bg: #E8EAEE;
  --surface: #F7F8FA;
  --ink: #12141C;
  --muted: #565B6B;
  --line: #C6CAD4;
  --accent: #D6006F;
  --accent-ink: #FFFFFF;
  --accent-soft: #F9D3E6;
  --font-display: 'Bricolage Grotesque', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111319;
    --surface: #1B1E27;
    --ink: #F0F1F5;
    --muted: #A2A7B6;
    --line: #333745;
    --accent: #FF4DA6;
    --accent-ink: #14161E;
    --accent-soft: #4A1D37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111319;
  --surface: #1B1E27;
  --ink: #F0F1F5;
  --muted: #A2A7B6;
  --line: #333745;
  --accent: #FF4DA6;
  --accent-ink: #14161E;
  --accent-soft: #4A1D37;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Kopf */
header { display: grid; gap: 12px; margin-bottom: 28px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.6rem, 9vw, 5rem);
  line-height: 0.95;
  letter-spacing: -0.03em;
  margin: 0;
  text-wrap: balance;
}
h1 span { color: var(--accent); }
.intro { max-width: 60ch; margin: 0; color: var(--muted); font-size: 1.05rem; }

/* Raster */
.layout { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* Kalender */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; position: sticky; top: 16px; }
@media (max-width: 860px) { .cal { position: static; } }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.cal-title { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; }
.cal-nav { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line);
  background: transparent; color: var(--ink); cursor: pointer; font-size: 18px; line-height: 1;
  display: grid; place-items: center;
}
.icon-btn:hover { border-color: var(--ink); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); text-align: center; padding-bottom: 4px; }
.day {
  aspect-ratio: 1 / 1; max-width: 100%;
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 13px;
  border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--ink);
  padding: 0;
}
.day.muted { color: var(--muted); opacity: 0.5; }
.day.today { border-color: var(--muted); }
button.day { cursor: pointer; background: var(--accent); color: var(--accent-ink); font-weight: 500; }
button.day:hover { filter: brightness(1.08); }
button.day.selected { outline: 2px solid var(--ink); outline-offset: 2px; }
.cal-foot { margin: 14px 0 0; font-size: 13px; color: var(--muted); }

/* Filter */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip {
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink);
}
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Tickets */
.events { display: grid; gap: 12px; }
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; scroll-margin-top: 16px; }
.ticket[open] { border-color: var(--ink); }
.ticket > summary { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; list-style: none; cursor: pointer; border-radius: 12px; }
.ticket > summary::-webkit-details-marker { display: none; }
.stub {
  background: var(--accent); color: var(--accent-ink);
  border-radius: 11px 0 0 11px; padding: 14px 8px; text-align: center;
  display: grid; place-content: center; gap: 0;
}
.stub .dd { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1; letter-spacing: -0.02em; }
.stub .mm { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
.stub .wd2 { font-family: var(--font-mono); font-size: 11px; opacity: 0.85; }
.info { border-left: 2px dashed var(--bg); padding: 14px 16px; min-width: 0; display: grid; gap: 4px; align-content: center; }
.artist { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; line-height: 1.1; letter-spacing: -0.01em; margin: 0; overflow-wrap: anywhere; }
.meta { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.tag { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--ink); }
.chev { align-self: center; padding-right: 16px; }
.chev::before {
  content: ""; display: block; width: 9px; height: 9px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(45deg); transition: transform 0.15s ease;
}
.ticket[open] .chev::before { transform: rotate(225deg); }

.detail { padding: 4px 20px 20px 20px; display: grid; gap: 16px; border-top: 1px dashed var(--line); margin: 0 0 0 0; padding-top: 16px; }
.why { margin: 0; max-width: 60ch; }
.label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 0 0 6px; }
.songs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.songs li { display: flex; align-items: center; gap: 10px; }
.songs li::before {
  content: ""; flex: none; width: 0; height: 0;
  border-left: 9px solid var(--accent); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
}
.songs .none { color: var(--muted); }
.songs .none::before { display: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font-body); font-weight: 600; font-size: 15px; text-decoration: none;
  padding: 10px 18px; border-radius: 8px; border: 2px solid var(--ink);
}
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:hover { transform: translateY(-1px); }
.empty { color: var(--muted); padding: 24px 0; }
footer { margin-top: 40px; font-size: 13px; color: var(--muted); }

@media (max-width: 480px) {
  .ticket > summary { grid-template-columns: 68px minmax(0, 1fr) auto; }
  .stub .dd { font-size: 1.8rem; }
  .artist { font-size: 1.2rem; }
  .chev { padding-right: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .chev::before { transition: none; }
  .btn:hover { transform: none; }
}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Zürich und Umgebung · Saison 26/27</div>
    <h1>Mit mir ans <span>Konzert</span></h1>
    <p class="intro">Hier sind die Konzerte und Events, bei denen ich dabei sein will. Klick auf einen Termin, hör dir meine Lieblingssongs an und sag mir, ob du mitkommst.</p>
  </header>

  <div class="layout">
    <aside class="cal" aria-label="Kalender">
      <div class="cal-head">
        <div class="cal-title" id="calTitle" aria-live="polite"></div>
        <div class="cal-nav">
          <button class="icon-btn" id="prev" type="button" aria-label="Vorheriger Monat">&#8249;</button>
          <button class="icon-btn" id="next" type="button" aria-label="Nächster Monat">&#8250;</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <p class="cal-foot" id="calFoot"></p>
    </aside>

    <main>
      <div class="filters" id="filters" role="group" aria-label="Nach Musikrichtung filtern"></div>
      <div class="events" id="events"></div>
    </main>
  </div>

  <footer>Alle Angaben ohne Gewähr. Bitte Uhrzeit und Tickets beim Veranstalter prüfen.</footer>
</div>

<script>
(function () {
  var FALLBACK = [
    { id: 'tiavo', artist: 'Tiavo', date: '2026-10-28', time: '20:00', venue: 'Dynamo (Grosser Saal)', city: 'Zürich', genre: 'Pop-Rock',
      tour: 'Hotel Tiavo Tour', why: '', songs: [], spotify: '',
      tickets: 'https://www.eventim.de/noapp/event/21299031/', ticketLabel: 'Tickets ansehen' },
    { id: 'neelix', artist: 'Neelix & Friends', date: '2026-10-31', time: '22:00', venue: 'Konzerthaus Schüür', city: 'Luzern', genre: 'Psytrance',
      tour: 'Halloween Special bis 06:00 Uhr, mit Bassforscher, Murphy Haze, Schameleon und Ebrax', why: '', songs: [], spotify: 'https://open.spotify.com/search/Neelix',
      tickets: 'https://www.schuur.ch/programm/events/event-details/neelix-friends-31-10-2026-konzerthaus-schuur-luzern', ticketLabel: 'Infos und Tickets' },
    { id: 'wednesday13', artist: 'Wednesday 13', date: '2026-12-07', time: '', venue: 'Dynamo (Saal)', city: 'Zürich', genre: 'Horror-Rock',
      tour: 'Cursed Blessings Tour, zusammen mit The Birthday Massacre', why: '', songs: [], spotify: '',
      tickets: 'https://officialwednesday13.com/2026/06/wednesday-13-the-birthday-massacre-european-co-headline-tour/', ticketLabel: 'Tour-Infos und Tickets' },
    { id: 'avatar', artist: 'Avatar', date: '2026-12-12', time: '', venue: 'Komplex 457', city: 'Zürich', genre: 'Metal',
      tour: 'Don\u2019t Go In The Forest Tour, Special Guest: Neckbreakker', why: '', songs: [], spotify: '',
      tickets: 'https://www.avatarmetal.com/tour', ticketLabel: 'Tour-Infos und Tickets' }
  ];


  var MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  var MON_SHORT = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
  var WD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  var WD_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

  function parse(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }

  var EVENTS = [];
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var view = { y: today.getFullYear(), m: today.getMonth() };
  var filter = 'Alle';
  var selected = null;

  var elTitle = document.getElementById('calTitle');
  var elGrid = document.getElementById('calGrid');
  var elFoot = document.getElementById('calFoot');
  var elFilters = document.getElementById('filters');
  var elEvents = document.getElementById('events');

  function visible() {
    return EVENTS.filter(function (e) { return filter === 'Alle' || e.genre === filter; });
  }

  function calUrl(e) {
    var p = e.date.split('-');
    var base = p[0] + p[1] + p[2];
    var dates;
    if (e.time) {
      var hm = e.time.split(':');
      var startD = new Date(+p[0], +p[1] - 1, +p[2], +hm[0], +hm[1]);
      var endD = new Date(startD.getTime() + 3 * 3600 * 1000);
      var f = function (d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + 'T' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '00'; };
      dates = f(startD) + '/' + f(endD);
    } else {
      var nx = new Date(+p[0], +p[1] - 1, +p[2] + 1);
      dates = base + '/' + nx.getFullYear() + String(nx.getMonth() + 1).padStart(2, '0') + String(nx.getDate()).padStart(2, '0');
    }
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent(e.artist + ' live') +
      '&dates=' + dates +
      '&ctz=Europe/Zurich' +
      '&location=' + encodeURIComponent([e.venue, e.city].filter(Boolean).join(', ')) +
      '&details=' + encodeURIComponent((e.tour ? e.tour + '\n' : '') + (e.tickets ? 'Tickets: ' + e.tickets : ''));
  }

  var SHEET_ID = '1qciJUcgPQjxKBHw0qPn8UzcfuHoyiUI0o09zNsPDezs';
  var SHEET_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv';

  function pad(n) { return String(n).padStart(2, '0'); }
  function safeUrl(u) { u = (u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; }

  function parseCsv(text) {
    var rows = [], row = [], cur = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else { q = false; } }
        else { cur += c; }
      } else if (c === '"') { q = true; }
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); rows.push(row); row = []; cur = '';
      } else { cur += c; }
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  function normDate(s) {
    s = (s || '').trim();
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
    m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
    if (m) return m[3] + '-' + pad(m[2]) + '-' + pad(m[1]);
    return '';
  }
  function normTime(s) {
    var m = (s || '').trim().match(/^(\d{1,2}):(\d{2})/);
    return m ? pad(m[1]) + ':' + m[2] : '';
  }
  function colIndex(head, names) {
    for (var i = 0; i < head.length; i++) {
      if (names.indexOf(head[i].trim().toLowerCase()) >= 0) return i;
    }
    return -1;
  }

  /* gibt null zurück, wenn die Kopfzeile nicht passt (zum Beispiel bei einer Login-Seite) */
  function rowsToEvents(rows) {
    if (!rows.length) return null;
    var h = rows[0];
    var ix = {
      artist: colIndex(h, ['künstler', 'kuenstler', 'artist']),
      date: colIndex(h, ['datum', 'date']),
      time: colIndex(h, ['uhrzeit', 'zeit', 'time']),
      venue: colIndex(h, ['ort', 'venue']),
      city: colIndex(h, ['stadt', 'city']),
      genre: colIndex(h, ['musikrichtung', 'genre']),
      info: colIndex(h, ['zusatzinfo', 'info']),
      tickets: colIndex(h, ['ticket-link', 'tickets', 'ticket']),
      spotify: colIndex(h, ['spotify-link', 'spotify']),
      songs: colIndex(h, ['lieblingssongs', 'songs'])
    };
    if (ix.artist < 0 || ix.date < 0) return null;
    function get(r, k) { return ix[k] >= 0 && r[ix[k]] ? r[ix[k]].trim() : ''; }
    var out = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      var artist = get(r, 'artist');
      var date = normDate(get(r, 'date'));
      if (!artist || !date) continue;
      var songs = get(r, 'songs');
      out.push({
        id: 'ev' + i, artist: artist, date: date, time: normTime(get(r, 'time')),
        venue: get(r, 'venue'), city: get(r, 'city'), genre: get(r, 'genre') || 'Konzert',
        tour: get(r, 'info'), why: '',
        songs: songs ? songs.split(';').map(function (x) { return x.trim(); }).filter(Boolean) : [],
        spotify: safeUrl(get(r, 'spotify')), tickets: safeUrl(get(r, 'tickets')), ticketLabel: 'Tickets und Infos'
      });
    }
    return out;
  }

  function setEvents(list) {
    EVENTS = list.filter(function (e) { return parse(e.date) >= today; });
    EVENTS.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    filter = 'Alle';
    selected = null;
    var st = EVENTS.length ? parse(EVENTS[0].date) : today;
    view = { y: st.getFullYear(), m: st.getMonth() };
    renderFilters();
    renderEvents();
    renderCal();
  }

  function loadSheet() {
    fetch(SHEET_URL)
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.text(); })
      .then(function (t) {
        var evs = rowsToEvents(parseCsv(t));
        if (evs) setEvents(evs);
      })
      .catch(function () { /* die eingebauten Ersatzdaten bleiben sichtbar */ });
  }

  function renderFilters() {
    var genres = ['Alle'];
    EVENTS.forEach(function (e) { if (genres.indexOf(e.genre) < 0) genres.push(e.genre); });
    elFilters.innerHTML = genres.map(function (g) {
      return '<button type="button" class="chip" data-genre="' + esc(g) + '" aria-pressed="' + (g === filter) + '">' + esc(g) + '</button>';
    }).join('');
  }

  function renderCal() {
    elTitle.textContent = MONTHS[view.m] + ' ' + view.y;
    var first = new Date(view.y, view.m, 1);
    var lead = (first.getDay() + 6) % 7;
    var dim = new Date(view.y, view.m + 1, 0).getDate();
    var byDay = {};
    var count = 0;
    visible().forEach(function (e) {
      var d = parse(e.date);
      if (d.getFullYear() === view.y && d.getMonth() === view.m) {
        (byDay[d.getDate()] = byDay[d.getDate()] || []).push(e);
        count++;
      }
    });
    var html = WD.map(function (w) { return '<div class="wd">' + w + '</div>'; }).join('');
    for (var i = 0; i < lead; i++) html += '<div class="day muted" aria-hidden="true"></div>';
    for (var d = 1; d <= dim; d++) {
      var evs = byDay[d];
      var isToday = today.getFullYear() === view.y && today.getMonth() === view.m && today.getDate() === d;
      if (evs) {
        var sel = evs.some(function (e) { return e.id === selected; });
        var label = d + '. ' + MONTHS[view.m] + ': ' + evs.map(function (e) { return e.artist; }).join(', ');
        html += '<button type="button" class="day' + (sel ? ' selected' : '') + (isToday ? ' today' : '') + '" data-id="' + esc(evs[0].id) + '" aria-label="' + esc(label) + '">' + d + '</button>';
      } else {
        html += '<div class="day' + (isToday ? ' today' : '') + '">' + d + '</div>';
      }
    }
    elGrid.innerHTML = html;
    elFoot.textContent = count === 0 ? 'In diesem Monat steht nichts an.' : (count === 1 ? '1 Termin in diesem Monat.' : count + ' Termine in diesem Monat.');
  }

  function renderEvents() {
    var list = visible();
    if (!list.length) { elEvents.innerHTML = '<p class="empty">' + (EVENTS.length ? 'Für diese Musikrichtung ist noch nichts eingetragen.' : 'Aktuell sind keine Konzerte geplant.') + '</p>'; return; }
    elEvents.innerHTML = list.map(function (e) {
      var d = parse(e.date);
      var songs = e.songs.length
        ? e.songs.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('')
        : '<li class="none">Meine Lieblingssongs folgen.</li>';
      var spotify = e.spotify || ('https://open.spotify.com/search/' + encodeURIComponent(e.artist));
      var cal = calUrl(e);
      var when = e.time ? esc(e.time) + ' Uhr' : 'Uhrzeit folgt';
      return '<details class="ticket" id="ev-' + esc(e.id) + '" data-id="' + esc(e.id) + '"' + (e.id === selected ? ' open' : '') + '>' +
        '<summary>' +
          '<div class="stub"><span class="mm">' + MON_SHORT[d.getMonth()] + '</span><span class="dd">' + d.getDate() + '</span><span class="wd2">' + WD_LONG[d.getDay()].slice(0, 2) + '</span></div>' +
          '<div class="info"><h3 class="artist">' + esc(e.artist) + '</h3>' +
            '<div class="meta"><span>' + when + '</span><span>' + esc([e.venue, e.city].filter(Boolean).join(', ')) + '</span><span class="tag">' + esc(e.genre) + '</span></div></div>' +
          '<div class="chev" aria-hidden="true"></div>' +
        '</summary>' +
        '<div class="detail">' +
          (e.tour ? '<p class="why">' + esc(e.tour) + '</p>' : '') +
          (e.why ? '<p class="why">' + esc(e.why) + '</p>' : '') +
          '<div><p class="label">Meine Lieblingssongs</p><ul class="songs">' + songs + '</ul></div>' +
          '<div class="actions">' +
            (e.tickets ? '<a class="btn primary" href="' + esc(e.tickets) + '" target="_blank" rel="noopener noreferrer">' + esc(e.ticketLabel || 'Tickets ansehen') + '</a>' : '') +
            '<a class="btn ghost" href="' + esc(spotify) + '" target="_blank" rel="noopener noreferrer">Auf Spotify anhören</a>' +
            '<a class="btn ghost" href="' + esc(cal) + '" target="_blank" rel="noopener noreferrer">Zu Google Kalender</a>' +
          '</div>' +
        '</div>' +
      '</details>';
    }).join('');
  }

  function select(id, scroll) {
    var e = EVENTS.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    selected = id;
    var d = parse(e.date);
    view = { y: d.getFullYear(), m: d.getMonth() };
    renderCal();
    var el = document.getElementById('ev-' + id);
    if (el) {
      el.open = true;
      if (scroll) {
        var smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
      }
    }
  }

  function shift(delta) {
    var d = new Date(view.y, view.m + delta, 1);
    view = { y: d.getFullYear(), m: d.getMonth() };
    renderCal();
  }

  document.getElementById('prev').addEventListener('click', function () { shift(-1); });
  document.getElementById('next').addEventListener('click', function () { shift(1); });

  elGrid.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-id]');
    if (b) select(b.getAttribute('data-id'), true);
  });

  elFilters.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-genre]');
    if (!b) return;
    filter = b.getAttribute('data-genre');
    renderFilters();
    renderEvents();
    renderCal();
  });

  elEvents.addEventListener('toggle', function (ev) {
    var t = ev.target;
    if (t.open && t.getAttribute('data-id') && t.getAttribute('data-id') !== selected) {
      select(t.getAttribute('data-id'), false);
    }
  }, true);

  setEvents(FALLBACK);
  loadSheet();
})();
</script>
